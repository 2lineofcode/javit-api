name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install project package manager
        run: npm install --global @yarnpkg/cli-dist@4.18.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript type check
        run: yarn type-check

      - name: Check code formatting
        run: yarn format:check

      - name: Run API regression checks
        run: yarn test

      - name: Build project
        run: yarn build

  deploy:
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install project package manager
        run: npm install --global @yarnpkg/cli-dist@4.18.1
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@62.1.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@62.1.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@62.1.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
